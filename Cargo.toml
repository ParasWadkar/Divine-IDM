[workspace]
resolver = "3"
members = [
    "crates/idm-core",
    "crates/idm-net",
    "crates/idm-cli",
    "crates/idm-ipc",
    "crates/idm-host",
    "crates/idm-store",
    "crates/idm-engine",
    "crates/idm-media",
    "crates/idm-torrent",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
# Let-chains, which this code uses throughout, stabilised in 1.88. The
# declared 1.85 was never true: the workspace would not build on it.
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
bytes = "1"
# Hardware-accelerated CRC32C: used for the journal's per-block checksums, so
# recovery verifies the data rather than trusting the journal.
crc32c = "0.6.8"
clap = { version = "4", features = ["derive"] }
httpdate = "1.0.3"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
tokio-stream = "0.1"
url = "2"
# Transparent decompression is deliberately NOT enabled: a content coding on a
# ranged response makes byte offsets address the encoded entity, which silently
# breaks every offset the scheduler computes. Leaving gzip/brotli/deflate/zstd
# out means reqwest neither advertises nor applies them.
reqwest = { version = "0.13.5", default-features = true, features = ["stream"] }
proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# The benchmark harness needs symbols and debug info while still being fast.
[profile.bench-release]
inherits = "release"
debug = true
strip = false
panic = "unwind"
