[workspace]
resolver = "3"
members = ["crates/idm-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
bytes = "1"
# Hardware-accelerated CRC32C: used for the journal's per-block checksums, so
# recovery verifies the data rather than trusting the journal.
crc32c = "0.6.8"
proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# The benchmark harness needs symbols and debug info while still being fast.
[profile.bench-release]
inherits = "release"
debug = true
strip = false
panic = "unwind"
