<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Divine IDM</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 13px/1.45 system-ui, sans-serif;
        margin: 0; padding: 14px; width: 280px;
        background: Canvas; color: CanvasText;
      }
      h1 { font-size: 14px; margin: 0 0 10px; }
      .status { padding: 8px 10px; border-radius: 6px; margin-bottom: 12px; }
      /* The browser's own words, under the headline: smaller, and able to
         wrap, because these strings are a sentence long. */
      .detail { margin-top: 6px; font-size: 11px; opacity: 0.85; overflow-wrap: anywhere; }
      .ok   { background: #e7f5ec; color: #14532d; }
      .warn { background: #fef3c7; color: #78350f; }
      .bad  { background: #fee2e2; color: #7f1d1d; }
      @media (prefers-color-scheme: dark) {
        .ok { background: #14321f; color: #bbf7d0; }
        .warn { background: #3a2c08; color: #fde68a; }
        .bad { background: #3b1111; color: #fecaca; }
      }
      label { display: flex; align-items: center; gap: 8px; margin: 9px 0; }
      .switch-row { justify-content: space-between; cursor: pointer; }
      .toggle { display: inline-flex; align-items: center; gap: 8px; user-select: none; }
      .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
      .toggle .track {
        position: relative; width: 34px; height: 18px; border-radius: 999px;
        background: color-mix(in srgb, CanvasText 28%, Canvas);
        transition: background .15s;
      }
      .toggle .track::after {
        content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
        border-radius: 50%; background: Canvas; transition: transform .15s;
      }
      .toggle input:checked + .track { background: #2f9e5b; }
      .toggle input:checked + .track::after { transform: translateX(16px); }
      .toggle input:focus-visible + .track { outline: 2px solid Highlight; outline-offset: 2px; }
      .toggle .state { min-width: 24px; font-size: 12px; font-weight: 600; }
      input[type="number"] { width: 72px; }
      button { margin-top: 10px; width: 100%; padding: 6px; }
      .hint { opacity: .75; font-size: 11px; margin-top: 4px; }
    </style>
  </head>
  <body>
    <h1>Divine IDM</h1>
    <div id="status" class="status warn">Checking…</div>

    <!-- A switch with the word beside it, not a bare checkbox: "On" and "Off"
         say which way is which without anyone having to guess. -->
    <label class="switch-row" for="enabled">
      <span>Take over downloads</span>
      <span class="toggle">
        <input type="checkbox" id="enabled" role="switch" />
        <span class="track"></span>
        <span class="state" id="enabled-state">On</span>
      </span>
    </label>
    <label>
      Only above
      <input type="number" id="minSize" min="0" step="1" /> MB
    </label>
    <label>
      <input type="checkbox" id="forwardCookies" />
      Send cookies for logged-in downloads
    </label>
    <div class="hint">
      Asks for cookie access only when you turn this on.
    </div>

    <button id="pair" hidden>Request pairing</button>
    <script src="popup.js"></script>
  </body>
</html>
