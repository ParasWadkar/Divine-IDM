[package]
name = "idm-app"
description = "DivinePulse desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "divinepulse"
path = "src/main.rs"

[dependencies]
idm-core = { path = "../../crates/idm-core" }
idm-engine = { path = "../../crates/idm-engine" }
idm-ipc = { path = "../../crates/idm-ipc" }
idm-store = { path = "../../crates/idm-store" }
idm-torrent = { path = "../../crates/idm-torrent" }
serde = { workspace = true }
serde_json.workspace = true
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.5"
# The native folder picker for the download-folder setting. The stable 2.x line:
# the newest release on the index is a 3.0 alpha, which targets a Tauri this
# app is not on.
tauri-plugin-dialog = "2"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
# Checking a finished download against the hash its source published. The
# three are what download pages actually give out; all are RustCrypto and
# share one `digest` trait, so it is three thin wrappers rather than three
# implementations.
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
digest = "0.10"
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    # The icon the shell already shows for a kind of file, so a download
    # looks in the list the way it will look in Explorer.
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
