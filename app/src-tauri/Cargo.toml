[package]
name = "idm-app"
description = "Divine IDM desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "divine-idm"
path = "src/main.rs"

[dependencies]
idm-core = { path = "../../crates/idm-core" }
idm-engine = { path = "../../crates/idm-engine" }
idm-ipc = { path = "../../crates/idm-ipc" }
idm-store = { path = "../../crates/idm-store" }
serde = { workspace = true }
serde_json.workspace = true
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.5"
# The native folder picker for the download-folder setting. The stable 2.x line:
# the newest release on the index is a 3.0 alpha, which targets a Tauri this
# app is not on.
tauri-plugin-dialog = "2"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
