[package]
name = "idm-cli"
description = "Command line driver for the Divine IDM engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "idm"
path = "src/main.rs"

[dependencies]
idm-core = { path = "../idm-core" }
idm-engine = { path = "../idm-engine" }
idm-store = { path = "../idm-store" }
idm-ipc = { path = "../idm-ipc" }
idm-net = { path = "../idm-net" }
clap.workspace = true
serde = { workspace = true }
thiserror.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
tempfile.workspace = true
