[package]
name = "idm-net"
description = "Transport adapters: HTTP ranged fetching wired to the core scheduler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
idm-core = { path = "../idm-core" }
idm-media = { path = "../idm-media" }
bytes.workspace = true
httpdate.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream.workspace = true
tracing.workspace = true
url.workspace = true
# native-tls rather than rustls for FTPS: it uses the operating system's
# trust store, which is what an FTPS server with a corporate or self-signed
# certificate needs, and it needs no client config built by hand.
suppaftp = { version = "12", features = ["native-tls"] }
russh = "0.63.1"
russh-sftp = "3.0.1"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
