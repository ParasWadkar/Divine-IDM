[package]
name = "idm-engine"
description = "The download engine as a library: job registry, IPC server, pairing and settings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
idm-core = { path = "../idm-core" }
idm-ipc = { path = "../idm-ipc" }
idm-media = { path = "../idm-media" }
idm-net = { path = "../idm-net" }
idm-store = { path = "../idm-store" }
idm-torrent = { path = "../idm-torrent" }
lol_html = "3.0.3"
reqwest.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tracing.workspace = true
# Only to unpack one named file out of an archive whose hash already matched
# the publisher's, and whose contents are then checked against the lock. No
# compression features beyond the one these archives use.
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # WinHttpGetProxyForUrl, for networks whose proxy is decided by a script
    # rather than by a setting. See src/pac.rs for why this rather than an
    # embedded JavaScript engine.
    "Win32_Networking_WinHttp",
    "Win32_System_Registry",
    # GetLocalTime, for the bandwidth schedule: the machine's own idea of
    # what day and time it is, including when the clocks go forward.
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
tempfile.workspace = true
# "test-util" gives a paused clock, so the schedule tests do not wait for
# a boundary to come round in real time.
tokio = { workspace = true, features = ["full", "test-util"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
