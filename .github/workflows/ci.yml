name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The cfg has to be repeated here, and leaving it out is not a warning
  # but a hard failure: an environment RUSTFLAGS *replaces* `[build]
  # rustflags` in .cargo/config.toml rather than merging with it, so
  # setting this variable at all silently discards the HTTP/3 cfg and
  # reqwest refuses to compile. See .cargo/config.toml.
  RUSTFLAGS: -D warnings --cfg reqwest_unstable

jobs:
  check:
    # The engine is Windows-specific (NTFS sparse files, Win32 preallocation,
    # named pipes), so there is no point testing it anywhere else.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      # Before Clippy, not after, and that ordering is load-bearing. The
      # Tauri app bundles `idm.exe`, `idm-host.exe` and the built extension
      # as resources, and its build script fails outright when they are
      # absent -- so `cargo clippy --all-targets` cannot even check the app
      # on a clean checkout. Locally it passes anyway, because a developer
      # has those files lying around from the last release build, which is
      # exactly why this went unnoticed: CI was the only place that ever
      # started from nothing. The same artefacts are what the end-to-end
      # scripts run against further down, so this is a reordering rather
      # than extra work.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the extension the app bundles
        run: node extension/build.mjs

      - name: Build the binaries the app bundles and the scripts drive
        run: cargo build --release -p idm-cli -p idm-host -p idm-net --bins

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Tests
        run: cargo test --all-features

      # Property tests find what the fixed cases miss, so give them far more
      # cases than the local default, where CI time is affordable. PROPTEST_CASES
      # only affects proptest targets, so re-running the whole suite is cheap.
      - name: Property tests (extended)
        run: cargo test --all-features
        env:
          PROPTEST_CASES: "20000"

      # The engine's own tests prove each piece; these drive the whole product
      # the way a person does -- a real engine process, a real browser helper,
      # real servers on real sockets -- and they are where the joins between
      # the pieces get tested. Two of them, resume-after-restart and
      # network-drop, cover the failures people actually hit and judge a
      # download manager by, and until now both were run only by hand.
      #
      # The browser-chain scripts (host-chain, firefox-chain, stream-chain and
      # the rest) stay manual: they want a real Chrome or Firefox, or ffmpeg.
      # tests/bench stays out on purpose -- wall clock on a shared runner
      # measures the runner.
      - name: End-to-end
        shell: bash
        run: |
          for script in engine-schemes resume-after-restart network-drop \
                        opaque-name duration capability-guard settings-wiring \
                        window-script invoke-wiring extension-guard; do
            echo "--- $script ---"
            node "tests/e2e/$script.mjs"
          done

      # Resume is the feature most likely to be quietly broken, and a single
      # run of the crash loop proves very little: each seed crashes at
      # different offsets, so sweep several. Each pass aborts a real child
      # process mid-write and then verifies the finished file byte for byte.
      - name: Crash-durability soak
        shell: bash
        run: |
          for seed in 1 7 42 1337 99991; do
            echo "--- crash soak seed $seed ---"
            IDM_CRASH_TEST_SEED=$seed cargo test --all-features \
              --test crash_resume -- --nocapture --test-threads=1
          done
