name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    # The engine is Windows-specific (NTFS sparse files, Win32 preallocation,
    # named pipes), so there is no point testing it anywhere else.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Tests
        run: cargo test --all-features

      # Property tests find what the fixed cases miss, so give them far more
      # cases than the local default, where CI time is affordable. PROPTEST_CASES
      # only affects proptest targets, so re-running the whole suite is cheap.
      - name: Property tests (extended)
        run: cargo test --all-features
        env:
          PROPTEST_CASES: "20000"

      # Resume is the feature most likely to be quietly broken, and a single
      # run of the crash loop proves very little: each seed crashes at
      # different offsets, so sweep several. Each pass aborts a real child
      # process mid-write and then verifies the finished file byte for byte.
      - name: Crash-durability soak
        shell: bash
        run: |
          for seed in 1 7 42 1337 99991; do
            echo "--- crash soak seed $seed ---"
            IDM_CRASH_TEST_SEED=$seed cargo test --all-features \
              --test crash_resume -- --nocapture --test-threads=1
          done
