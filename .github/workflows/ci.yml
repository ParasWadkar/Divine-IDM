name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    # The engine is Windows-specific (NTFS sparse files, Win32 preallocation,
    # named pipes), so there is no point testing it anywhere else.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Tests
        run: cargo test --all-features

      # Property tests find what the fixed cases miss, so give them far more
      # cases than the local default, where CI time is affordable. PROPTEST_CASES
      # only affects proptest targets, so re-running the whole suite is cheap.
      - name: Property tests (extended)
        run: cargo test --all-features
        env:
          PROPTEST_CASES: "20000"
